name: Release-plz

permissions:
  contents: write

on:
  push:
    branches:
      - master

jobs:
  # On every push to master, publish any crate whose version in Cargo.toml is
  # newer than the one on crates.io, in dependency order (financial-ops-macros
  # before financial-ops), then create git tags and GitHub releases.
  #
  # Release flow: bump the crate versions + update CHANGELOG.md in a normal
  # commit, push to master, and this job ships it.
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
