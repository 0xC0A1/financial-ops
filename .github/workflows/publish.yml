name: Publish (manual fallback)

# Automated releases are handled by `release-plz.yml` on pushes to `master`.
# This workflow is a manual fallback for one-off or emergency publishes, and
# for dry-running the workspace publish.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run cargo publish in --dry-run mode (no upload)"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Gate the release on the same checks CI runs.
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features
      - name: Test
        run: cargo test --verbose

      # `cargo publish --workspace` publishes every crate in dependency order
      # (financial-ops-macros before financial-ops) and waits for the index.
      - name: Publish (dry run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: cargo publish --workspace --dry-run

      - name: Publish
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: cargo publish --workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
